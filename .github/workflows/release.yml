# Publish to WordPress.org only when a plugin version tag (e.g. 1.0.1) is pushed.
# Dated push tags (vYYYY.MM.DD-HHMM) start with "v" and never match, so they do not deploy.
# Needs repo secrets SVN_USERNAME and SVN_PASSWORD (WordPress.org account raselhk).
name: Deploy to WordPress.org

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: swiftwebdev-dashboard-analytics
