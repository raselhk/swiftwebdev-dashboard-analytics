# Publish to WordPress.org when a release tag (e.g. 1.0.1) is pushed.
# Needs repo secrets SVN_USERNAME and SVN_PASSWORD (WordPress.org account raselhk) once the plugin is approved.
name: Deploy to WordPress.org

on:
  push:
    tags:
      - "*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: swift-dashboard-analytics
