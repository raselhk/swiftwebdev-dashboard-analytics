<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon</title>
<link rel="stylesheet" href="brand.css">
<style>
	/* Laid out at 128x128; render.cjs shoots it at 1x and 2x (256x256). */
	.icon { width: 128px; height: 128px; display: grid; place-items: center; }
	.icon svg { width: 84px; height: 84px; }
</style>
</head>
<body>
<div class="icon dark">
	<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="#E8672B"/><circle cx="21" cy="11" r="8" fill="#2E9E4C" opacity=".92"/><circle cx="11" cy="21" r="8" fill="#4F5BFF" opacity=".92"/><circle cx="21" cy="21" r="8" fill="#F2C23A" opacity=".9"/></svg>
</div>
</body>
</html>
